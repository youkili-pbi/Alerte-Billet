name: Surveillance prix business

on:
  schedule:
    - cron: "17 * * * *"     # toutes les heures (heure UTC)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write             # pour sauvegarder history.json dans le dépôt

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Vérifier les prix
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python watcher.py

      - name: Sauvegarder l'historique
        if: always()
        run: |
          git config user.name "price-watch-bot"
          git config user.email "price-watch-bot@users.noreply.github.com"
          git add history.json || true
          git diff --cached --quiet || git commit -m "Historique des prix $(date -u +%F-%H%M)"
          git push
